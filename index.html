<!doctype html>
<html lang="en">
<head>
<meta name="description" content="Drill-down design for building the Jira-to-merge agent pipeline on Google ADK, Antigravity and Google Cloud, with numbered build steps on every component.">

<title>Google Agent Pipeline</title>
<style>
:root{--bg:#f6f7f9;--ink:#0f172a;--mut:#64748b;--line:#d5dae1;--card:#fff;--acc:#1f4fd8;--accbg:#e8eefc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;position:sticky;top:0;z-index:5}
.crumbs{font-size:13px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--acc);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--ink)}
h1{margin:4px 0 0;font-size:20px}
.lvl{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);background:var(--accbg);padding:2px 8px;border-radius:10px;margin-right:8px;vertical-align:middle}
main{padding:20px 24px 60px;max-width:1500px;margin:0 auto}
.sub{color:var(--mut);margin:0 0 16px}
.flow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.arrow{align-self:center;color:var(--mut);font-size:22px}
.scard{flex:1 1 220px;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.scard:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(31,79,216,.12)}
.scard .num{display:inline-flex;width:26px;height:26px;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;align-items:center;justify-content:center;font-size:12px}
.scard.sup .num{background:#475569}
.scard h3{margin:8px 0 4px;font-size:16px}
.scard p{margin:0 0 10px;color:var(--mut);font-size:13px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid}
.scard .go{margin-top:10px;font-size:12px;color:var(--acc);font-weight:600}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:26px 0 10px}
.canvas{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto}
svg text{font-family:inherit}
.node{cursor:pointer}
.node:hover rect{stroke-width:2.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend s{display:inline-block;width:22px;height:0;border-top:2px solid;text-decoration:none}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:900px}
.card .hd{padding:16px 20px;border-bottom:1px solid var(--line)}
.card .hd h2{margin:0 0 4px;font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid;margin-right:6px}
table{border-collapse:collapse;width:100%}
td{padding:11px 20px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{width:170px;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.nb{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 20px;border-top:1px solid var(--line)}
@media(max-width:700px){.nb{grid-template-columns:1fr}}
.nb h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.nb a{display:block;padding:5px 8px;margin:0 0 4px;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13px}
.nb a:hover{border-color:var(--acc);background:var(--accbg)}
.nb a small{color:var(--mut);display:block}
.nb p{margin:0;color:var(--mut);font-size:13px}
.hint{color:var(--mut);font-size:12px;margin-top:10px}
#tip{position:fixed;z-index:50;max-width:440px;background:#0f172a;color:#f1f5f9;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.5;box-shadow:0 8px 28px rgba(15,23,42,.35);pointer-events:none;display:none}
#tip h5{margin:0 0 6px;font-size:14px;color:#fff}#tip small{display:block;color:#93c5fd;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#tip p{margin:0}#tip .tl{margin-top:8px;color:#cbd5e1;font-size:12px}
.dsc{font-size:9px;fill:#475569;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.elist{margin:14px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px}
.elist li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.elist b{display:inline-block;min-width:20px;color:var(--acc)}
.elist .p{display:block;color:var(--mut);margin-top:3px;white-space:pre-line}
.eh{cursor:help}
.card.deep{max-width:1000px}
.toc{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:#f8fafc;position:sticky;top:78px;z-index:3}
.toc a{font-size:12px;color:var(--acc);text-decoration:none;padding:2px 8px;border:1px solid var(--line);border-radius:9px;background:#fff}
.sec{padding:16px 20px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.sec h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.sec ul,.sec ol{margin:4px 0;padding-left:20px}.sec li{margin:3px 0}
.dumbbox{background:#f0f6ff;border-left:4px solid var(--acc);padding:12px 14px;border-radius:6px;white-space:pre-line}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.formula{background:#0f172a;color:#e2e8f0;padding:10px 12px;border-radius:6px;overflow:auto;white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.sec table td{padding:7px 10px;font-size:13px}.sec table td:first-child{width:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600}
.sec table.t3 td:first-child{width:22%}
.no li::marker{color:#c2410c}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#eef2ff;border:1px solid #c7d2fe;margin:0 4px 4px 0}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.refs a{color:var(--acc)}
.refs li{margin:4px 0;font-size:13px}
.xtab{font-size:12.5px}.xtab th{text-align:left;background:#f1f5f9;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);position:sticky;top:0}
.xtab td{padding:6px 8px;border-bottom:1px solid var(--line);width:auto;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);font-weight:400}
.xtab td:first-child{font-weight:600;width:auto;color:var(--ink);text-transform:none;font-size:12.5px;letter-spacing:0}
.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:8px 0;line-height:1.5}.steps code,.xtab code,.sec code{background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:12px;word-break:break-all}
</style>
</head>

<header><div class="crumbs" id="crumbs"></div><h1 id="title"></h1></header>
<main id="main"></main>
<script>
const D = {"stages":[{"id":"intake","n":"1","role":"main","title":"Intake","blurb":"A Jira ticket turns into one queued job. Nothing is written to code yet. The only goal is that every ticket is seen once and only once.","nodes":[{"id":"jira","base":"jira","c":0,"r":0,"ghost":false},{"id":"poll","base":"poll","c":0,"r":1,"ghost":false},{"id":"wh","base":"wh","c":1,"r":0,"ghost":false},{"id":"ps","base":"ps","c":2,"r":0,"ghost":false},{"id":"disp","base":"disp","c":3,"r":0,"ghost":false},{"id":"dedupe","base":"dedupe","c":4,"r":0,"ghost":false},{"id":"exec","base":"exec","c":4,"r":1,"ghost":false}],"edges":[{"a":"jira","b":"wh","l":"web request","k":"e","d":"POST with ticket key, summary, description and the secret header"},{"a":"poll","b":"ps","l":"missed tickets","k":"d","d":"Messages for tickets the webhook missed"},{"a":"wh","b":"ps","l":"publish","k":"e","d":"The ticket event with attributes ticket_key and project"},{"a":"ps","b":"disp","l":"push","k":"e","d":"OIDC-authenticated HTTP push, retried up to 5 times"},{"a":"disp","b":"dedupe","l":"claim","k":"n","d":"Create-if-absent on the ticket key"},{"a":"disp","b":"exec","l":"start job","k":"e","d":"Run request with TICKET_KEY override"}],"frames":[],"groups":[{"id":"queue","title":"Ticket to queue","members":["jira","wh","poll","ps"],"line":"Jira rule fires a signed web request; a public Cloud Run receiver checks it and publishes to Pub/Sub. A poll job catches anything missed.","dumb":"Think of a mailroom. Jira drops a letter at the front desk, the clerk checks the stamp, and puts it in the sorting tray. A second clerk walks the floor every few minutes in case a letter was dropped."},{"id":"dispatch","title":"Dedupe and launch","members":["disp","dedupe","exec"],"line":"A private dispatcher claims the ticket in Firestore, then starts one Cloud Run Job execution for it.","dumb":"Before anyone starts work, a supervisor checks the ticket was not already taken. If free, they stamp it taken and send one worker."}]},{"id":"agent","n":"2","role":"main","title":"Agent run","blurb":"A Cloud Run Job runs an Agent Development Kit (ADK) pipeline: plan, code with Antigravity, fix CI up to 3 times, open a PR.","nodes":[{"id":"job","base":"job","c":1,"r":0,"ghost":false},{"id":"guard","base":"guard","c":1,"r":1,"ghost":false},{"id":"ci_tool","base":"ci_tool","c":1,"r":2,"ghost":false},{"id":"pipe","base":"pipe","c":2,"r":0,"ghost":false},{"id":"plan","base":"plan","c":3,"r":0,"ghost":false},{"id":"code","base":"code","c":4,"r":0,"ghost":false},{"id":"agy","base":"agy","c":5,"r":0,"ghost":false},{"id":"fixloop","base":"fixloop","c":5,"r":1,"ghost":false},{"id":"pr","base":"pr","c":6,"r":0,"ghost":false},{"id":"exec*","base":"exec","gk":["intake","dispatch"],"ghost":true,"c":0,"r":0}],"edges":[{"a":"exec*","b":"job","l":"run","k":"e","d":"Execution with TICKET_KEY set"},{"a":"job","b":"pipe","l":"start","k":"e","d":"Runner builds the root agent and runs it once"},{"a":"pipe","b":"plan","l":"step 1","k":"e","d":"Ticket text and repo path in session state"},{"a":"plan","b":"code","l":"plan","k":"e","d":"state.plan: files, steps, tests"},{"a":"code","b":"agy","l":"run session","k":"n","d":"Prompt and repo directory; JSON result back"},{"a":"guard","b":"code","l":"refuse","k":"s","d":"Blocks forbidden tool calls before they run"},{"a":"guard","b":"plan","l":"refuse","k":"s","d":"Same rulebook on the planner's tools"},{"a":"code","b":"fixloop","l":"diff","k":"e","d":"Branch with the first change"},{"a":"fixloop","b":"ci_tool","l":"wait for CI","k":"n","d":"Head SHA out; pass or failing log back","bi":true},{"a":"fixloop","b":"pr","l":"green","k":"e","d":"Branch that passes CI"}],"frames":[],"groups":[{"id":"pipeline","title":"Job and pipeline","members":["job","pipe","plan","code","agy","guard"],"line":"The Cloud Run Job starts an ADK SequentialAgent: planner, then coder. The coder runs Antigravity headless. Callbacks guard every tool.","dumb":"One worker gets a desk. A foreman agent reads the ticket and writes a plan, then hands the plan to a coder. The coder uses Antigravity as its hands. A guard stands at the door and refuses forbidden moves."},{"id":"pr","title":"Fix loop and pull request","members":["fixloop","ci_tool","pr"],"line":"A LoopAgent re-runs the coder when CI fails, up to 3 rounds, then opens the PR.","dumb":"After the first try, the worker checks the test results. If they fail it tries again, but only 3 times. Then it opens the pull request."}]},{"id":"verify","n":"3","role":"main","title":"Verify","blurb":"Three independent checks look at the PR: tests, an AI review that only comments, and a structured AI review that outputs JSON.","nodes":[{"id":"ci","base":"ci","c":1,"r":0,"ghost":false},{"id":"assist","base":"assist","c":1,"r":1,"ghost":false},{"id":"gcli","base":"gcli","c":1,"r":2,"ghost":false},{"id":"pr*","base":"pr","gk":["agent","pr"],"ghost":true,"c":0,"r":0},{"id":"scorer*","base":"scorer","gk":["gate","score"],"ghost":true,"c":2,"r":0}],"edges":[{"a":"pr*","b":"ci","l":"push","k":"e","d":"Head SHA triggers the workflow"},{"a":"pr*","b":"assist","l":"diff","k":"n","d":"Gemini Code Assist reads the PR"},{"a":"pr*","b":"gcli","l":"diff","k":"e","d":"Structured review workflow reads the PR"},{"a":"ci","b":"scorer*","l":"check runs","k":"n","d":"Pass or fail for each required job"},{"a":"gcli","b":"scorer*","l":"review JSON","k":"e","d":"issues, severity, touches_security, confidence"},{"a":"assist","b":"scorer*","l":"comment count","k":"n","d":"Count of open comments, informational only"}],"frames":[],"groups":[{"id":"checks","title":"Checks on the PR","members":["ci","assist","gcli"],"line":"GitHub Actions runs tests, Gemini Code Assist comments only, and run-gemini-cli returns a JSON review.","dumb":"Three inspectors look at the same change. One runs the tests. One writes comments that nobody must obey. One fills in a form that the risk step reads."}]},{"id":"gate","n":"4","role":"main","title":"Risk and gate","blurb":"A model proposes a risk tier, code raises it if rules say so, and a required GitHub check blocks merge until the tier's approvals exist.","nodes":[{"id":"scorer","base":"scorer","c":0,"r":0,"ghost":false},{"id":"floor","base":"floor","c":1,"r":0,"ghost":false},{"id":"elig","base":"elig","c":2,"r":1,"ghost":false},{"id":"cap","base":"cap","c":3,"r":0,"ghost":false},{"id":"human","base":"human","c":3,"r":2,"ghost":false},{"id":"policy","base":"policy","c":4,"r":2,"ghost":false},{"id":"check","base":"check","c":5,"r":1,"ghost":false}],"edges":[{"a":"scorer","b":"floor","l":"model tier","k":"e","d":"Tier and reasons from the model"},{"a":"floor","b":"elig","l":"final tier","k":"e","d":"max of model tier and floor tier"},{"a":"elig","b":"cap","l":"eligible","k":"e","d":"Low-tier PR asks for an unattended slot"},{"a":"elig","b":"human","l":"needs human","k":"e","d":"Medium, high and excluded-path PRs"},{"a":"human","b":"policy","l":"approval","k":"e","d":"Review bound to head SHA"},{"a":"cap","b":"check","l":"slot","k":"e","d":"allow or deny"},{"a":"policy","b":"check","l":"approvals","k":"e","d":"approved or pending"},{"a":"elig","b":"check","l":"eligibility","k":"n","d":"Result and reasons"}],"frames":[],"groups":[{"id":"score","title":"Score the PR","members":["scorer","floor","elig"],"line":"ADK scorer proposes a tier; deterministic floor can only raise it; eligibility checks excluded paths, size and the human author.","dumb":"A model says how risky the change feels. Then a plain rulebook can make that score higher but never lower. Then a checklist decides if this PR may skip a human."},{"id":"approve","title":"Cap, policy and the required check","members":["cap","policy","check","human"],"line":"Daily cap per source, human approval rules, and the GitHub App check run the ruleset requires.","dumb":"Three locks on the merge button: a daily limit, an approvals rule, and a single required check that turns green only when the other two agree."}]},{"id":"ship","n":"5","role":"main","title":"Merge and ship","blurb":"GitHub's merge queue re-tests the PR on top of main, then Cloud Build ships it behind a canary with an automatic rollback.","nodes":[{"id":"ruleset","base":"ruleset","c":1,"r":0,"ghost":false},{"id":"mqci","base":"mqci","c":1,"r":1,"ghost":false},{"id":"mq","base":"mq","c":2,"r":0,"ghost":false},{"id":"deploy","base":"deploy","c":3,"r":0,"ghost":false},{"id":"canary","base":"canary","c":4,"r":0,"ghost":false},{"id":"rollback","base":"rollback","c":5,"r":0,"ghost":false},{"id":"check*","base":"check","gk":["gate","approve"],"ghost":true,"c":0,"r":0}],"edges":[{"a":"check*","b":"ruleset","l":"required","k":"e","d":"risk-gate is on the required list"},{"a":"ruleset","b":"mq","l":"allow","k":"e","d":"PR with all required checks enters the queue"},{"a":"mq","b":"mqci","l":"test","k":"e","d":"Speculative merge commit","bi":true},{"a":"mq","b":"deploy","l":"merged","k":"e","d":"Commit on main triggers build"},{"a":"deploy","b":"canary","l":"revision","k":"e","d":"New revision tagged candidate"},{"a":"canary","b":"rollback","l":"bad","k":"s","d":"Error rate or latency above threshold"}],"frames":[],"groups":[{"id":"merge","title":"Merge queue","members":["ruleset","mq","mqci"],"line":"A ruleset requires risk-gate and CI; the merge queue re-tests the PR on top of main before it lands.","dumb":"A single-file line at a door. Each change is tested again with the changes ahead of it, so two good changes cannot break each other."},{"id":"release","title":"Deploy, canary, rollback","members":["deploy","canary","rollback"],"line":"Cloud Build ships the merged commit to Cloud Run with a small slice of traffic, then widens it or rolls back.","dumb":"New version goes to a few users first. If the numbers look bad it is pulled back automatically."}]},{"id":"audit","n":"6","role":"main","title":"Audit and learn","blurb":"Every decision becomes a log line, lands in BigQuery, and a weekly sample puts humans back on risky merges.","nodes":[{"id":"elog","base":"elog","c":1,"r":0,"ghost":false},{"id":"sched2","base":"sched2","c":1,"r":1,"ghost":false},{"id":"shadow","base":"shadow","c":1,"r":2,"ghost":false},{"id":"sink","base":"sink","c":2,"r":0,"ghost":false},{"id":"bq","base":"bq","c":3,"r":0,"ghost":false},{"id":"sample","base":"sample","c":4,"r":0,"ghost":false},{"id":"reread","base":"reread","c":5,"r":0,"ghost":false},{"id":"check*","base":"check","gk":["gate","approve"],"ghost":true,"c":0,"r":0},{"id":"deploy*","base":"deploy","gk":["ship","release"],"ghost":true,"c":0,"r":1},{"id":"exec*","base":"exec","gk":["intake","dispatch"],"ghost":true,"c":0,"r":2},{"id":"human*","base":"human","gk":["gate","approve"],"ghost":true,"c":6,"r":0},{"id":"rollback*","base":"rollback","gk":["ship","release"],"ghost":true,"c":0,"r":3},{"id":"scorer*","base":"scorer","gk":["gate","score"],"ghost":true,"c":6,"r":1}],"edges":[{"a":"elog","b":"sink","l":"log lines","k":"d","d":"Structured JSON entries"},{"a":"sink","b":"bq","l":"rows","k":"e","d":"Partitioned by day"},{"a":"bq","b":"sample","l":"last 7 days","k":"n","d":"Query reads the events"},{"a":"sched2","b":"sample","l":"weekly","k":"d","d":"Cron triggers the assignment job"},{"a":"sample","b":"reread","l":"picked merges","k":"e","d":"Rows in audit_queue"},{"a":"shadow","b":"scorer*","l":"planted","k":"n","d":"Known-bad diffs go to the scorer"},{"a":"reread","b":"human*","l":"verdict","k":"n","d":"Findings feed reviewer training"},{"a":"exec*","b":"elog","l":"job_started","k":"d","d":"Event line written to the log"},{"a":"check*","b":"elog","l":"decision","k":"d","d":"Event line written to the log"},{"a":"deploy*","b":"elog","l":"deploy_started","k":"d","d":"Event line written to the log"},{"a":"rollback*","b":"elog","l":"rollback","k":"d","d":"Event line written to the log"}],"frames":[],"groups":[{"id":"log","title":"Event log","members":["elog","sink","bq"],"line":"Structured log lines become rows in BigQuery through a Logging sink.","dumb":"Every decision writes one line in a notebook. A copier moves the notebook into a spreadsheet nobody can edit."},{"id":"sampling","title":"Sampling and re-read","members":["sample","sched2","reread","shadow"],"line":"A weekly query picks merges for a human re-read, weighted toward risk; planted bad changes test the gate.","dumb":"Once a week a human re-checks a sample of what the machine let through, biased toward the risky ones. Bad changes are planted on purpose to see if the gate catches them."}]},{"id":"ident","n":"7","role":"support","title":"Identity and secrets","blurb":"Who each piece runs as, and where its keys live. No long-lived keys on disk.","nodes":[{"id":"wif","base":"wif","c":0,"r":0,"ghost":false},{"id":"sa","base":"sa","c":1,"r":0,"ghost":false},{"id":"sm","base":"sm","c":2,"r":1,"ghost":false},{"id":"app","base":"app","c":3,"r":2,"ghost":false},{"id":"check*","base":"check","gk":["gate","approve"],"ghost":true,"c":4,"r":3},{"id":"job*","base":"job","gk":["agent","pipeline"],"ghost":true,"c":4,"r":0},{"id":"pr*","base":"pr","gk":["agent","pr"],"ghost":true,"c":4,"r":2},{"id":"wh*","base":"wh","gk":["intake","queue"],"ghost":true,"c":4,"r":1}],"edges":[{"a":"wif","b":"sa","l":"impersonate","k":"s","d":"Actions identity maps to a service account"},{"a":"sa","b":"sm","l":"accessor","k":"s","d":"Each account reads only its secret"},{"a":"sm","b":"app","l":"private key","k":"s","d":"Key used to mint installation tokens"},{"a":"app","b":"pr*","l":"token","k":"s","d":"PR opener writes with the App token"},{"a":"app","b":"check*","l":"token","k":"s","d":"Gate writes the required check"},{"a":"sm","b":"wh*","l":"secret","k":"s","d":"Receiver reads the webhook secret"},{"a":"sa","b":"job*","l":"run as","k":"s","d":"Agent job runs as sa-agent"}],"frames":[],"groups":[{"id":"who","title":"Identity and secrets","members":["sa","wif","sm","app"],"line":"One service account per role, Workload Identity Federation for GitHub Actions, Secret Manager for the few secrets, a GitHub App for repo write ebhook@PROJECT.iam.gserviceaccount.com --set-secrets JIRA_SECRET=jira-webhook-secret:latest`.","Grant publish rights on the topic only: `gcloud pubsub topics add-iam-policy-binding ticket-events --member serviceAccount:sa-webhook@PROJECT.iam.gserviceaccount.com --role roles/pubsub.publisher`.","Copy the service URL into the Jira rule from the Jira card.","Send a test with `curl -X POST URL -H 'X-Webhook-Secret: WRONG'` and confirm 401."],"refs":[17,19,18],"prop":"Runbook has no public receiver; Google has no Jira trigger, so a small public endpoint is needed."},"poll":{"label":"Poll fallback","sub":"Cloud Scheduler + Cloud Run Job","kind":"gcp","stage":"intake","group":"queue","inn":"Cloud Scheduler tick","out":"Pub/Sub messages for any unclaimed ticket","store":"Firestore claims (read); Jira REST (read)","fail":"If the poll fails, the next tick retries. The dedupe stage makes double delivery harmless.","req":"Runbook: scheduled task that picks tickets up","line":"Every 10 minutes asks Jira for ready tickets not yet claimed, publishes them.","dumb":"A second clerk who walks the floor and re-checks the inbox, in case Jira's call never arrived.","steps":["Write a job that runs this Jira query language (JQL) filter: `labels = agent-ready AND statusCategory != Done`.","For each hit, publish to `ticket-events` with the same attributes the receiver uses.","Build and create the job: `gcloud run jobs deploy jira-poll --source . --region us-central1`.","Create the schedule: `gcloud scheduler jobs create http jira-poll-tick --schedule '*/10 * * * *' --uri https://run.googleapis.com/v2/projects/PROJECT/locations/us-central1/jobs/jira-poll:run --http-method POST --oauth-service-account-email sa-scheduler@PROJECT.iam.gserviceaccount.com`.","Grant the scheduler account `roles/run.invoker` on the job."],"refs":[25,16],"prop":"Runbook uses a Claude scheduled task. This is the Google equivalent."},"ps":{"label":"Pub/Sub topic and push subscription","sub":"ticket-events","kind":"gcp","stage":"intake","group":"queue","inn":"Messages from the receiver and poll job","out":"Authenticated HTTP push to the dispatcher","store":"Pub/Sub topics ticket-events and ticket-events-dlq","fail":"After 5 failed pushes the message moves to the dead-letter topic; an alert fires.","req":"DevX proposal: durability between webhook and job","line":"Durable buffer with retries and a dead-letter topic; pushes to the dispatcher with an OpenID Connect (OIDC) token.","dumb":"The sorting tray. Letters wait here safely. If the supervisor is busy, the tray tries again, and after five failures it sets the letter aside for a human.","steps":["Create topics: `gcloud pubsub topics create ticket-events` and `gcloud pubsub topics create ticket-events-dlq`.","Create the push subscription: `gcloud pubsub subscriptions create dispatcher-push --topic ticket-events --push-endpoint DISPATCHER_URL --push-auth-service-account sa-pubsub-push@PROJECT.iam.gserviceaccount.com --ack-deadline 60 --dead-letter-topic ticket-events-dlq --max-delivery-attempts 5`.","Allow the push account to invoke the dispatcher: add `roles/run.invoker` on the dispatcher service.","Give the Pub/Sub service agent publish rights on the dead-letter topic and subscriber rights on the subscription (the console warns you if missing).","Publish a test message with `gcloud pubsub topics publish ticket-events --message '{}'` and watch the dispatcher log."],"refs":[18],"hard":"UNVERIFIED: exact IAM roles for the Pub/Sub service agent on dead-letter topics; the console prints the required bindings."},"disp":{"label":"Dispatcher","sub":"Cloud Run service, private","kind":"own","stage":"intake","group":"dispatch","inn":"Authenticated push from Pub/Sub","out":"Job execution request carrying ticket key","store":"Firestore claims; Cloud Run Admin API","fail":"If the claim fails because it already exists, ack and stop. If the job start fails, return 500 so Pub/Sub retries.","req":"Runbook: Claude scheduled task; DevX proposal for rts execution of the agent job with the ticket key as an argument override.","dumb":"The hand-off. The supervisor presses the start button on a fresh worker and writes down which worker got which ticket.","steps":["Grant the dispatcher account `roles/run.developer` on the job.","Call the Cloud Run v2 `jobs.run` method with an `overrides.containerOverrides[0].env` entry `TICKET_KEY`.","Store the returned execution name on `claims/{ticket_key}`.","Log a structured event `job_started` with ticket key and execution name."],"refs":[15],"hard":"UNVERIFIED: the client-library call shape for per-execution env overrides; test it against the REST reference."},"job":{"label":"Agent Cloud Run job","sub":"One execution per ticket","kind":"gcp","stage":"agent","group":"pipeline","inn":"Env var TICKET_KEY from the launcher","out":"Exit code and structured logs; a PR as a side effect","store":"Ephemeral disk; Secret Manager read","fail":"Timeout or crash: job ends, no retry. Dispatcher's claim record shows no PR, and an alert fires.","req":"Runbook: cloud session","line":"Container with ADK, Antigravity CLI, git. Timeout 60 min, no retries, runs as sa-agent.","dumb":"A throwaway computer. It starts fresh for each ticket, runs for at most an hour, and is deleted when done.","steps":["Write a Dockerfile: Python 3.12, `pip install google-adk`, install the Antigravity CLI, install git and gh.","Add `main.py` that reads `TICKET_KEY`, builds the ADK runner and runs the root agent once.","Create the account: `gcloud iam service-accounts create sa-agent`.","Create the job: `gcloud run jobs create agent-run --image IMAGE --region us-central1 --task-timeout 60m --max-retries 0 --service-account sa-agent@PROJECT.iam.gserviceaccount.com --set-secrets GEMINI_API_KEY=gemini-api-key:latest`.","Set memory and CPU high enough for a repo checkout: `--memory 4Gi --cpu 2`.","Clone the target repo inside `main.py` with a GitHub App installation token (see GitHub App card)."],"refs":[15,4],"hard":"UNVERIFIED: `gcloud run jobs --max-retries` flag spelling on your CLI version; check with `gcloud run jobs create --help`."},"pipe":{"label":"Root pipeline","sub":"ADK SequentialAgent","kind":"adk","stage":"agent","group":"pipeline","inn":"Ticket text and repo path in session state","out":"State keys plan, diff, ci_result, pr_url","store":"ADK session state","fail":"Any sub-agent raising an error stops the pipeline and the job exits non-zero.","req":"Runbook: cloud session runs the ticket end to end","line":"Runs planner then coder then fix loop in order; state passes through session state keys.","dumb":"The foreman's checklist: plan first, code second, test-and-fix third. Each step leaves notes the next step reads.","steps":["Install ADK: `pip install google-adk`.","Create the root: `SequentialAgent(name='ticket_pipeline', sub_agents=[planner, coder_loop])` with `from google.adk.agents import SequentialAgent`.","Seed state with `ticket_key`, `summary`, `description`, `repo_dir`.","Run locally against a test ticket with `adk run ticket_pipeline`.","Serve a dev UI with `adk web` to see each step's state."],"refs":[0,1],"hard":"ADK 2.x deprecates SequentialAgent, ParallelAgent and LoopAgent in favour of a graph Workflow. They still work; plan a move to Workflow later. UNVERIFIED: exact Workflow class names."},"plan":{"label":"Planner agent","sub":"LlmAgent, read-only tools","kind":"adk","stage":"agent","group":"pipeline","inn":"Ticket text, AGENTS.md, repo tree","out":"state.plan: files, steps, test plan","store":"Read-only repo tools","fail":"If the plan lists an excluded path, the pipeline stops and labels the ticket needs-human.","req":"Runbook: agent reads ticket and rules before coding","line":"Reads the ticket and the repo's rules, writes a plan with files to touch and tests to add.","dumb":"A foreman who only reads. They study the ticket, check which files matter, and write a short plan. They cannot change anything.","steps":["Create `LlmAgent(name='planner', model= ach the callback to planner and coder.","Add a unit test per rule."],"refs":[2]},"fixloop":{"label":"CI fix loop","sub":"ADK LoopAgent, max 3 rounds","kind":"adk","stage":"agent","group":"pr","inn":"state.diff, branch name","out":"Green CI, or escalation after 3 rounds","store":"Session state round counter","fail":"Round 3 red: label the PR needs-human, stop, log `fix_loop_exhausted`.","req":"Runbook: fix CI failures, capped","line":"Push, wait for CI, if red feed the failing log to the coder, repeat. Stop at 3 rounds or green.","dumb":"A retry counter. Try, check the tests, try again. After 3 tries the worker stops and asks for a human.","steps":["Build `LoopAgent(name='ci_fix', sub_agents=[coder, ci_checker], max_iterations=3)`.","In `ci_checker` set `tool_context.actions.escalate = True` when CI is green, which ends the loop.","Put the failing check name and the last 200 log lines into `state.ci_result` for the coder.","After the loop, if CI is still red, call the label tool with `needs-human`.","Write a test that forces red three times and expects exactly 3 rounds."],"refs":[1],"hard":"The 3-round cap lives here and in the single constants block, not in the model prompt."},"ci_tool":{"label":"CI status tool","sub":"Function tool over GitHub API","kind":"own","stage":"agent","group":"pr","inn":"Branch name, head SHA","out":"pass / fail with log excerpt / timeout","store":"GitHub API (read)","fail":"No result in 20 minutes: returns timeout, counted as a failed round.","req":"Runbook: CI results feed the fix loop","line":"Polls check runs for the branch head, returns pass, fail with log tail, or timeout.","dumb":"The agent's way to look at the scoreboard. It asks GitHub for the test results and reads the failing lines.","steps":["Write `get_ci_status(sha)` using `GET /repos/{o}/{r}/commits/{sha}/check-runs`.","Return `pass` only when every required check has conclusion `success`.","On failure fetch the job log and return the last 200 lines.","Poll every 30 seconds ard)."],"refs":[27,24]},"assist":{"label":"Gemini Code Assist check","sub":"GitHub app, comment-only","kind":"gh","stage":"verify","group":"checks","inn":"PR diff","out":"Review comments and a summary","store":"None","fail":"If the app is not installed or has no billing, no comments appear; the gate does not depend on it.","req":"Runbook: Code Review stage","line":"Posts review comments on the PR. It never approves and never counts toward merge.","dumb":"A reviewer that only leaves sticky notes. People and the agent can read them. They do not unlock the merge button.","steps":["Install the Gemini Code Assist GitHub app on the repo.","Link the project's billing account (needed for the app to run).","Add a `.gemini/styleguide.md` with the repo's review rules.","Do not list the app's identity in any approval policy.","Note it does not review changes under `.github/workflows`."],"refs":[10],"hard":"UNVERIFIED: severity markup in comments, so the scorer cannot parse severity from it. That is why the JSON review below exists."},"gcli":{"label":"Structured AI review","sub":"run-gemini-cli in Actions, JSON output","kind":"gh","stage":"verify","group":"checks","inn":"PR diff, repo rules","out":"JSON: issues[], severity, touches_security, confidence","store":"Workflow artifact","fail":"Invalid JSON or timeout: review marked missing, which sets the risk floor to at least medium (see Risk floor).","req":"Runbook: Code Review stage produces findings the scorer reads","line":"Runs Gemini CLI on the diff with a JSON schema; output feeds the risk scorer.","dumb":"The inspector who fills in a form. Every PR gets the same questions and the answers are machine readable.","steps":["Add a workflow job `uses: google-github-actions/run-gemini-cli@SHA` (pin to a commit).","Authenticate with Workload Identity Federation to Vertex AI, or a Gemini API key from Actions secrets.","Pass a prompt that demands JSON matching `review.schema.json`.","Upload the JSON as an artifact and as a check run function wrap(text,max){
  const words=text.split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max){ if(cur) lines.push(cur); cur=w } else cur=(cur+' '+w).trim() });
  if(cur) lines.push(cur); return lines;
}
function clip(s,n){return s.length>n?s.slice(0,n-1)+'…':s}

function graphView(st,head){

  /* Level 3: a gap between columns grows by 30px for every line beyond 5 that crosses it */
  const mc0=Math.max(...st.nodes.map(n=>n.c)), colX=[M]; 
  for(let c=0;c<mc0;c++){let x=0; if(st.route) st.edges.forEach(e=>{const A=byId[e.a],B=byId[e.b]; if(A&&B&&Math.min(A.c,B.c)<=c&&Math.max(A.c,B.c)>c) x++}); colX.push(colX[c]+CP+(st.route?Math.max(0,x-5)*30:0))}
  const cxOf=c=>colX[Math.floor(c)]+(c-Math.floor(c))*CP;
  const P = n => ({cx:cxOf(n.c), cy:T+n.r*RP});
  const side=(n,s)=>{const p=P(n);return s==='left'?[p.cx-NW/2,p.cy]:s==='right'?[p.cx+NW/2,p.cy]:s==='top'?[p.cx,p.cy-NH/2]:[p.cx,p.cy+NH/2]};
  const gx=c=>cxOf(c), gy=r=>T+r*RP;
  const maxC=Math.max(...st.nodes.map(n=>n.c)), maxR=Math.max(...st.nodes.map(n=>n.r));

  (st.frames||[]).forEach(f=>{
    const x=gx(f.c0)-NW/2-14,y=gy(f.r0)-NH/2-30,w=(f.c1-f.c0)*CP+NW+28,h=(f.r1-f.r0)*RP+NH+44;
    svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="${x+12}" y="${y+18}" font-size="12" font-weight="600" fill="#64748b">${esc(f.title)}</text>`;
  });
  const labels=[], laneUse={}, inUse={};
  /* Level 3 only: grid router. Lines may not enter any box or description block; they bend as little as possible and keep off lanes already lanes */
  const G=5, GW=Math.ceil(W/G)+1, GH=Math.ceil(H/G)+1, blk=new Uint8Array(GW*GH), hocc=new Uint8Array(GW*GH), vocc=new Uint8Array(GW*GH);
  const fill=(x,y,w,h,v)=>{v=v||1;for(let j=Math.floor((y-8)/G);j<=Math.ceil((y+h+8)/G);j++)for(let i=Math.floor((x-8)/G);i<=Math.ceil((x+w+8)/G);i++)if(i>=0&&j>=0&&i<GW&&j<GH&&i*G>x-6&&i*G<x+w+6&&j*G>y-6&&j*G<y+h+6)blk[j*GW+i]=Math.max(blk[j*GW+i],v)};
  if(st.route){st.nodes.forEach(n=>{const p=P(n); fill(p.cx-NW/2,p.cy-NH/2,NW,NH);
    if(!n.ghost){const c=D.comps[n.base]; let rows=0,sn=0; (c.line||'').split('\n').forEach(ln=>{rows+=Math.min(2,wrap(ln,54).length);sn++}); if(rows) fill(p.cx-155,p.cy+NH/2+3,310,rows*11.5+sn*3+4,2)}})}
  const heap=[], push=(k,v)=>{heap.push([k,v]);let i=heap.length-1;while(i>0){const q=(i-1)>>1;if(heap[q][0]<=heap[i][0])break;[heap[q],heap[i]]=[heap[i],heap[q]];i=q}},
    pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let m=i,a1=2*i+1,b1=a1+1;if(a1<heap.length&&heap[a1][0]<heap[m][0])m=a1;if(b1<heap.length&&heap[b1][0]<heap[m][0])m=b1;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return t};
  const DX=[1,0,-1,0], DY=[0,1,0,-1], BEND=45, XCOST=8, gArr=new Float32Array(GW*GH*4), prv=new Int32Array(GW*GH*4);
  /* route p0 (heading d0) to p1 so that it arrives heading dEnd. r = how many cells (5px each) another line running the same way must stay away; -1 ignores lines */
  const route1=(p0,d0,p1,dEnd,r)=>{
    const sx=Math.round(p0[0]/G), sy=Math.round(p0[1]/G), tx=Math.round(p1[0]/G), ty=Math.round(p1[1]/G);
    gArr.fill(1e9); const key=(i,j,d)=>(j*GW+i)*4+d; heap.length=0;
    gArr[key(sx,sy,d0)]=0; prv[key(sx,sy,d0)]=-1; push(0,[sx,sy,d0,0]);

      if(i===tx&&j===ty&&d===dEnd){end=k;break}
      for(let nd=0;nd<4;nd++){ if(nd===(d+2)%4) continue;

        const ci=nj*GW+ni, isT=ni===tx&&nj===ty; if(blk[ci]===1&&!isT) continue;

        if(blk[ci]===2){ if(r>=1) continue; nc+=60 }

          if(same&&same-1<=r&&!isT) continue; if(cross===1) nc+=XCOST }
        const nk=key(ni,nj,nd); if(nc<gArr[nk]){gArr[nk]=nc;prv[nk]=k;push(nc+Math.abs(ni-tx)+Math.abs(nj-ty),[ni,nj,nd,nc])}}}

    const cells=[]; for(let k=end;k>=0;k=prv[k]){const d=k%4, ij=(k-d)/4; cells.push([ij%GW,Math.floor(ij/GW)])}

/* ---------- Level 2: groups in a stage ---------- */

    return `<div class="scard" data-go="#/g/${id}/${g.id}" data-g="${g.id}"><h3>${esc(g.title)}</h3><p style="white-space:pre-line">${esc(g.line)}</p><div class="chips">${chips}</div>

/* ---------- Level 3: components of one group ---------- */
const GL={};
function groupView(sid,gid){

  D.stages.forEach(s=>s.edges.forEach(e=>{

    const gk=x=>'g:'+groupOf(x)+'*', na=ia?a:gk(a), nb=ib?b:gk(b); if(!ia) ghosts.add(gk(a)); if(!ib) ghosts.add(gk(b));

  const l1=[...direct]; nb.forEach((v,x)=>{if(!midG.includes(x)) l1.push(...hops(x))});
  midG.forEach(x=>{const v=nb.get(x), nm=[...new Set([...v.i,...v.o])], mn=Math.min(...nm.map(m=>depth0[m])); anchor[x]=nm.find(m=>depth0[m]===mn);
    nm.forEach(m=>l1.push(depth0[m]===mn?[m,x]:[x,m]))});
  const depth=relax([...g.members,...midG],l1,{});
  /* a group that only feeds members sits one column before its first target; one that only receives sits after its last source */
  const ghostCol={}, ghostMode={};
  nb.forEach((v,x)=>{const ins=v.o.map(m=>depth[m]), outs=v.i.map(m=>depth[m]);
    if(v.i.length&&v.o.length){ghostMode[x]='mid'; const nm=new Set([...v.i,...v.o]); ghostCol[x]=nm.size===1?depth[[...nm][0]]+1:depth[x]}
    else if(v.o.length){ghostMode[x]='src'; ghostCol[x]=Math.min(...ins)-1}
    else {ghostMode[x]='dst'; ghostCol[x]=Math.max(...outs)+1}});
  const minC=Math.min(0,...Object.values(ghostCol)), off=-minC;
  const used={}, take=(c,pref)=>{used[c]=used[c]||new Set(); let r=pref; const clash=r=>Object.keys(used).some(k=>Math.abs(k-c)<1&&used[k].has(r)); while(used[c].has(r)||clash(r)) r++; used[c].add(r); return r};
  const nodes=[], rowOf={};
  [...g.members].sort((x,y)=>depth[x]-depth[y]).forEach(m=>{const c=depth[m]+off; const r=take(c,0); rowOf[m]=r; nodes.push({id:m,base:m,c,r})});
  const gnode=(x,c,r)=>{const [gs,gg]=x.slice(2,-1).split('/'); GL[x]=S[gs].groups.find(q=>q.id===gg).title+' (group)'; nodes.push({id:x,gk:[gs,gg],ghost:true,c,r})};
  const mainRows=Math.max(...Object.values(rowOf))+1;
  [...nb.keys()].forEach(x=>{const c=ghostCol[x]+off, v=nb.get(x);
    if(ghostMode[x]==='mid'){gnode(x,c,take(c,rowOf[anchor[x]]))}
    else {const t=(ghostMode[x]==='src'?v.o:v.i)[0]; gnode(x,c,take(c,rowOf[t]+(used[c]&&used[c].has(rowOf[t])?1:0)))}});
  /* a pair of opposite lines between the same two boxes becomes one two-way line; both texts stay in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i]; if(e.bi) continue;
    const j=edges.findIndex((f,k)=>k>i&&!f.bi&&f.a===e.b&&f.b===e.a);
    if(j<0) continue; const f=edges[j];
    e.d=(e.l?e.l+': ':'')+(e.d||'')+'  |  back: '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' / ');
    e.k=e.k==='e'||f.k==='e'?'e':e.k; e.bi=true; edges.splice(j,1)}
  /* several lines between the same two boxes in the same direction become one line; every text stays in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i];
    for(let j=edges.length-1;j>i;j--){const f=edges[j]; if(f.a!==e.a||f.b!==e.b||!!f.bi!==!!e.bi) continue;
      e.d=(e.l?e.l+': ':'')+(e.d||'')+'  +  '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' + ');
      e.k=e.k==='e'||f.k==='e'?'e':e.k; edges.splice(j,1)}}
  /* number the lines in reading order: by source column, then target column */
  const colOf=Object.fromEntries(nodes.map(n=>[n.id,n.c])), rw=Object.fromEntries(nodes.map(n=>[n.id,n.r]));
  edges.sort((x,y)=>(colOf[x.a]-colOf[y.a])||(colOf[x.b]-colOf[y.b])||(rw[x.a]-rw[y.a]));
  const ps={n:st.n,title:g.title,blurb:g.line,nodes,edges,frames:[],route:true};
  const gi=st.groups.findIndex(z=>z.id===gid), pg=st.groups[gi-1], ng=st.groups[gi+1];
  graphView(ps,{crumbs:[{t:'Overview',href:'#/'},{t:st.n+'. '+st.title,href:'#/s/'+sid},{t:g.title}],
    title:`<span class="lvl">Level 3</span>${esc(g.title)} <small style="font-weight:400;color:var(--mut)">in ${esc(st.title)}</small>`,
    sub:g.line.replace(/\n/g,' '),
    nav:`<a href="#/s/${sid}">← All groups in ${esc(st.title)}</a>${pg?` &nbsp; <a href="#/g/${sid}/${pg.id}">← ${esc(pg.title)}</a>`:''}${ng?` &nbsp; <a href="#/g/${sid}/${ng.id}">${esc(ng.title)} →</a>`:''}`});
}
function hover(el,html){
  const t=$('tip');
  const mv=ev=>{const w=t.offsetWidth,h=t.offsetHeight;let x=ev.clientX+18,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-18;if(y+h>innerHeight-8)y=Math.max(8,innerHeight-h-8);t.style.left=Math.max(8,x)+'px';t.style.top=y+'px'};
  el.addEventListener('mouseenter',ev=>{t.innerHTML=html();t.style.display='block';mv(ev)});
  el.addEventListener('mousemove',mv);
  el.addEventListener('mouseleave',()=>{t.style.display='none'});
}

/* ---------- Level 3 ---------- */
function cardView(id){
  const c=D.comps[id]; if(!c){location.hash='#/';return}
  const st=S[c.stage], K=D.kinds[c.kind];
  const grp=st.groups.find(z=>z.id===c.group);
  crumbs([{t:'Overview',href:'#/'},{t:st.n+'. '+st.title,href:'#/s/'+st.id},{t:grp.title,href:'#/g/'+st.id+'/'+grp.id},{t:c.label}]);
  $('title').innerHTML=`<span class="lvl">Level 4</span>${esc(c.label)}`;
  const up=new Map(), down=new Map();
  D.stages.forEach(s=>s.edges.forEach(e=>{
    const a=e.a.replace(/\*$/,''), b=e.b.replace(/\*$/,'');
    if(b===id&&a!==id) up.set(a,(up.get(a)?up.get(a)+', ':'')+(e.l||'link'));
    if(a===id&&b!==id) down.set(b,(down.get(b)?down.get(b)+', ':'')+(e.l||'link'));
    if(e.bi&&b===id&&a!==id) down.set(a,e.l||'link');
  }));
  const list=m=>m.size?[...m].map(([k,l])=>`<a href="#/c/${k}">${esc(D.comps[k].label)}<small>${esc(l)}</small></a>`).join(''):'<p>None in this stage view.</p>';
  const dp=c.deep||null, ul=(a,cls)=>a&&a.length?`<ul class="${cls||''}">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>None.</p>';
  const R=ids=>(ids||[]).map(i=>D.refs[i]).filter(Boolean);
  let sec='';
  if(dp){
    const al=dp.algorithm||{}, ml=dp.ml, pf=dp.performance||{};
    sec+=`<div class="toc">${[['plain','In plain English'],['contract','Contract'],['purpose','Purpose'],['algo','Algorithm'],dp.math?['math','Maths in full']:null,ml?['ml','The model call']:null,['sec','Security'],['perf','Performance'],['edge','Edge cases'],['tests','Tests'],['cost','Cost'],['fb','Feedback and events'],(dp.papers||[]).length?['res','Research']:null,['refs','References']].filter(Boolean).map(([k,l])=>`<a href="javascript:void(0)" onclick="document.getElementById('sx-${k}').scrollIntoView({behavior:'smooth',block:'start'})">${l}</a>`).join('')}</div>`;
    sec+=`<div class="sec" id="sx-plain"><h3>In plain English</h3><div class="dumbbox">${esc(c.dumb||'')}</div></div>`;
  }
  const contract=`<div class="sec" id="sx-contract" style="padding:0"><table>
  <tr><td>Goes in</td><td>${esc(c.inn)}</td></tr>
  <tr><td>Comes out</td><td>${esc(c.out)}</td></tr>
  <tr><td>Reads / writes</td><td>${esc(c.store)}</td></tr>
  <tr><td>If it fails</td><td>${esc(c.fail)}</td></tr>
  <tr><td>Requirement source</td><td>${esc(c.req)}</td></tr>${c.hard?`<tr><td>Hardening, still open</td><td>${esc(c.hard)}</td></tr>`:''}${c.prop?`<tr><td>Not in client docs</td><td style="background:#fff7ed"><b>DevX proposal:</b> ${esc(c.prop)}</td></tr>`:''}</table></div>`;
  if(dp){
    const al=dp.algorithm||{}, ml=dp.ml, pf=dp.performance||{};
    sec+=contract;
    sec+=`<div class="sec" id="sx-purpose"><h3>What it is for</h3><p>${esc(dp.purpose)}</p><div class="two"><div><h4>Expected</h4>${ul(dp.expected)}</div><div><h4>Not expected</h4>${ul(dp.not_expected,'no')}</div></div></div>`;
    sec+=`<div class="sec" id="sx-algo"><h3>Algorithm and maths</h3><p><b>${esc(al.name||'')}</b></p><div class="formula mono">${esc(al.formula||'')}</div><h4>Steps</h4><ol>${(al.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>Parameters</h4><table class="t3">${Object.entries(al.params||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
    if(dp.math){const m=dp.math; sec+=`<div class="sec" id="sx-math"><h3>The maths in full</h3><h4>Symbols</h4>${ul(m.definitions)}<h4>Formula</h4><div class="formula mono">${esc(m.formula_full)}</div><h4>Why it is right</h4><p>${esc(m.derivation)}</p><h4>Worked example</h4><div class="formula mono">${esc(m.worked_example)}</div><h4>Cost of computing it</h4><p>${esc(m.complexity)}</p><h4>How it can go wrong, and the guard</h4>${ul(m.failure_modes)}<h4>How the numbers are chosen and re-tuned</h4><p>${esc(m.calibration)}</p>${(dp.alternatives||[]).length?`<h4>Alternatives rejected</h4><table class="t3">${dp.alternatives.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.why_rejected)}</td></tr>`).join('')}</table>`:''}</div>`}
    if(ml) sec+=`<div class="sec" id="sx-ml"><h3>The model call</h3><table class="t3"><tr><td>Technique</td><td>${esc(ml.technique)}</td></tr><tr><td>Model</td><td>${esc(ml.model)}</td></tr><tr><td>Input</td><td>${esc(ml.input)}</td></tr><tr><td>Output schema</td><td class="mono">${esc(ml.output_schema)}</td></tr><tr><td>Prompt sketch</td><td class="mono">${esc(ml.prompt_sketch)}</td></tr><tr><td>Guardrails</td><td>${ul(ml.guardrails)}</td></tr><tr><td>Cost estimate</td><td>${esc(ml.cost_estimate)}</td></tr></table></div>`;
    sec+=`<div class="sec" id="sx-sec"><h3>Security</h3>${ul(dp.security)}</div>`;
    sec+=`<div class="sec" id="sx-perf"><h3>Performance</h3><table class="t3"><tr><td>Latency and throughput</td><td>${esc(pf.slo)}</td></tr><tr><td>Complexity</td><td>${esc(pf.complexity)}</td></tr><tr><td>At 10x load</td><td>${esc(pf.scaling)}</td></tr></table></div>`;
    sec+=`<div class="sec" id="sx-edge"><h3>Edge cases and how each is handled</h3>${ul(dp.edge_cases)}</div>`;
    sec+=`<div class="sec" id="sx-tests"><h3>Test cases</h3><table class="xtab"><tr><th>Test</th><th>Given</th><th>Expect</th></tr>${(dp.tests||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.given)}</td><td>${esc(x.expect)}</td></tr>`).join('')}</table></div>`;
    sec+=`<div class="sec" id="sx-cost"><h3>Where it saves cost</h3>${ul(dp.cost_levers)}</div>`;
    sec+=`<div class="sec" id="sx-fb"><h3>Feedback and analytics events</h3><h4>Feedback captured or used</h4>${ul(dp.feedback_events)}<h4>Events emitted</h4><table class="xtab"><tr><th>Event</th><th>Fields</th><th>When</th></tr>${(dp.analytics_events||[]).map(x=>`<tr><td class="mono">${esc(x.name)}</td><td>${(x.fields||[]).map(f=>`<span class="pill">${esc(f)}</span>`).join('')}</td><td>${esc(x.when)}</td></tr>`).join('')}</table></div>`;
    if((dp.papers||[]).length||(dp.repos||[]).length) sec+=`<div class="sec refs" id="sx-res"><h3>Research behind it</h3>${(dp.papers||[]).map(x=>{const r=D.refs[x.ref];return `<p><a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.cite)}</b></a><br><i>Result we rely on:</i> ${esc(x.key_idea)}<br><i>Used here:</i> ${esc(x.how)}</p>`}).join('')}${(dp.repos||[]).length?`<h4>Open-source implementations studied</h4><ul>${dp.repos.map(x=>`<li><a href="${esc(D.refs[x.ref].url)}" target="_blank" rel="noopener">${esc(x.name)}</a>: ${esc(x.take)}</li>`).join('')}</ul>`:''}${dp.industry?`<h4>How others build it</h4><p>${esc(dp.industry)}</p>`:''}</div>`;
    const rr=R(dp.refs);
    sec+=`<div class="sec refs" id="sx-refs"><h3>References</h3>${rr.length?`<ul>${rr.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.cite)}</a></li>`).join('')}</ul>`:'<p>None cited for this node.</p>'}</div>`;
  } else {
    const rr=R(c.refs);
    sec+=`<div class="sec" id="sx-plain"><h3>In plain English</h3><div class="dumbbox">${esc(c.dumb||'')}</div></div>`+contract
      +`<div class="sec" id="sx-steps"><h3>Build steps (${(c.steps||[]).length})</h3><ol class="steps">${(c.steps||[]).map(x=>`<li>${fmt(x)}</li>`).join('')}</ol></div>`
      +`<div class="sec refs" id="sx-refs"><h3>Sources</h3>${rr.length?`<ul>${rr.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.cite)}</a></li>`).join('')}</ul>`:'<p>The source for this card is the requirement named above.</p>'}</div>`;
  }
  $('main').innerHTML=`<div class="card deep"><div class="hd"><span class="badge" style="background:${K.fill};border-color:${K.stroke}">${esc(K.name)}</span><span class="badge" style="border-color:#cbd5e1">Stage ${esc(st.n)}: ${esc(st.title)}</span><h2>${esc(c.label)}</h2><div style="color:var(--mut)">${esc(c.sub)}</div>${c.line?`<div style="margin-top:8px;white-space:pre-line">${esc(c.line)}</div>`:''}</div>${sec}
  <div class="nb"><div><h4>Receives from</h4>${list(up)}</div><div><h4>Hands to</h4>${list(down)}</div></div></div>
  <p class="hint"><a href="#/g/${st.id}/${grp.id}">← Back to group: ${esc(grp.title)}</a> &nbsp; <a href="#/s/${st.id}">← Stage ${esc(st.n)}</a></p>`;
}

/* ---------- cross-cutting pages ---------- */
function xView(id){
  const x=(D.xc||[]).find(v=>v.id===id); 
  if(id==='refs'){
    crumbs([{t:'Overview',href:'#/'},{t:'References'}]);
    $('title').innerHTML='<span class="lvl">Sources</span>Research and references';
    const by={}; D.refs.forEach((r,i)=>{(by[r.topic||'Other']=by[r.topic||'Other']||[]).push([i,r])});
    $('main').innerHTML=`<div class="card deep"><div class="sec refs" style="border:0">${Object.entries(by).sort().map(([k,v])=>`<h4>${esc(k)}</h4><ul>${v.map(([i,r])=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.cite)}</a></li>`).join('')}</ul>`).join('')}</div></div>`;
    return;
  }
  if(!x){location.hash='#/';return}
  crumbs([{t:'Overview',href:'#/'},{t:x.title}]);
  $('title').innerHTML=`<span class="lvl">Cross-cutting</span>${esc(x.title)}`;
  $('main').innerHTML=`<p class="sub">${esc(x.intro)}</p><div class="card deep">${x.sections.map(s=>`<div class="sec"><h3>${esc(s.h)}</h3>${s.p?`<p>${esc(s.p)}</p>`:''}${s.kind==='table'?`<div style="overflow:auto"><table class="xtab"><tr>${s.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${Array.isArray(c)?c.map(f=>`<span class="pill">${esc(f)}</span>`).join(''):fmt(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:ul(s.rows)}</div>`).join('')}</div>`;
}
function ul(a){return `<ul>${(a||[]).map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[\[(\w+)\]\]/g,(m,k)=>D.comps[k]?`<a href="#/c/${k}">${esc(D.comps[k].label)}</a>`:m)}

function route(){
  $('tip').style.display='none';
  const h=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(h[0]==='s') stageView(h[1]); else if(h[0]==='g') groupView(h[1],h[2]); else if(h[0]==='c') cardView(h[1]); else if(h[0]==='x') xView(h[1]); else overview();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const h=location.hash.split('/'); if(h[1]==='c'){const q=D.comps[h[2]]; location.hash='#/g/'+q.stage+'/'+q.group} else if(h[1]==='g') location.hash='#/s/'+h[2]; else if(h[1]==='s') location.hash='#/'; }});
route();
</script>
